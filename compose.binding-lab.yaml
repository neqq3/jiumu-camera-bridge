# Opt-in Linux lab only. Mounts contain private data and must be prepared first.
services:
  local-binding:
    profiles: [binding-lab]
    build:
      context: ./jiumu_bridge
      dockerfile: binding.Dockerfile
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    volumes:
      - ./data/binding-config:/config:ro
      - ./data/binding-state:/data
    restart: "no"
