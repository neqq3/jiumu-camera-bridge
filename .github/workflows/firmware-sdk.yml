name: BK7252N SDK compile research

on:
  push:
    branches: ['dev/bk7252n-firmware']
    paths: ['firmware/bk7252n/**', '.github/workflows/firmware-sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install FFmpeg if absent
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Test sensor adapter and native RTSP on loopback
        run: bash firmware/bk7252n/test-host.sh
      - name: Keep text-only test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bk7252n-protocol-evidence
          path: |
            firmware-host-results/*.log
            firmware-host-results/*.txt
            firmware-host-results/*.json
            firmware-host-results/*.framemd5
          retention-days: 14
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NonPIayerCharacter/beken_freertos_sdk
          ref: 1af1d4f549039bbecd7d07ffbbb7e24dc0bca57d
          path: sdk
          persist-credentials: false
      - name: Compile pinned SDK without contacting hardware
        shell: bash
        run: bash firmware/bk7252n/compile-sdk.sh
      - name: Retain compilation evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bk7252n-sdk-evidence
          path: firmware-results/
          retention-days: 14
          if-no-files-found: error
