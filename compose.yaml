services:
  jiumu-bridge:
    image: ${JIUMU_IMAGE:-ghcr.io/neqq3/jiumu-camera-bridge:0.1.0-dev.1}
    container_name: jiumu-bridge
    network_mode: host
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LOCAL_ONLY: "${LOCAL_ONLY:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      - ./data:/data
