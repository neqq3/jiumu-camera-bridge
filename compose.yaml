services:
  jiumu-bridge:
    build:
      context: ./jiumu_bridge
    image: jiumu-bridge:0.1.0
    container_name: jiumu-bridge
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      LOCAL_ONLY: "${LOCAL_ONLY:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      - ./data:/data
